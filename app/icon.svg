<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c9956b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9956b" stop-opacity="0"/>
    </radialGradient>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1225"/>
    </linearGradient>
    <!-- Moon gradient for depth -->
    <linearGradient id="moonFill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e0b088"/>
      <stop offset="50%" stop-color="#c9956b"/>
      <stop offset="100%" stop-color="#a87a52"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle glow behind moon -->
  <circle cx="280" cy="230" r="160" fill="url(#moonGlow)"/>

  <!-- Stars -->
  <circle cx="120" cy="130" r="4" fill="#e8e4df" opacity="0.9"/>
  <circle cx="390" cy="100" r="3" fill="#e8e4df" opacity="0.7"/>
  <circle cx="100" cy="300" r="3" fill="#e8e4df" opacity="0.6"/>
  <circle cx="420" cy="280" r="3.5" fill="#e8e4df" opacity="0.8"/>
  <circle cx="160" cy="400" r="2.5" fill="#e8e4df" opacity="0.5"/>
  <circle cx="370" cy="390" r="3" fill="#e8e4df" opacity="0.6"/>
  <circle cx="80" cy="200" r="2" fill="#e8e4df" opacity="0.4"/>
  <circle cx="440" cy="180" r="2.5" fill="#e8e4df" opacity="0.5"/>

  <!-- Star sparkles (cross pattern for brighter stars) -->
  <g opacity="0.9" fill="#e8e4df">
    <!-- Sparkle at top-left -->
    <line x1="120" y1="122" x2="120" y2="138" stroke="#e8e4df" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="112" y1="130" x2="128" y2="130" stroke="#e8e4df" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Crescent moon - large, centered -->
  <path
    d="M340 160
       A 120 120 0 1 1 200 380
       A 85 85 0 0 0 340 160Z"
    fill="url(#moonFill)"
  />

  <!-- Subtle highlight on moon edge -->
  <path
    d="M340 160
       A 120 120 0 1 1 200 380
       A 85 85 0 0 0 340 160Z"
    fill="none"
    stroke="#e0b088"
    stroke-width="2"
    opacity="0.3"
  />
</svg>
